name: Tests (Pull Requests)

on:
  pull_request:
    branches: [main, develop]

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '20'

jobs:
  test:
    name: PHP Tests + Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, xml, ctype, json, openssl
          coverage: none
          tools: composer:v2

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --force

      - name: Create fake Vite manifest (feature tests render Blade views)
        run: |
          mkdir -p public/build
          cat > public/build/manifest.json << 'EOF'
          {
            "resources/css/app.css":  {"file":"assets/app.css",  "src":"resources/css/app.css",  "isEntry":true},
            "resources/js/app.tsx":   {"file":"assets/app.js",   "src":"resources/js/app.tsx",   "isEntry":true},
            "resources/js/ssr.tsx":   {"file":"assets/ssr.js",   "src":"resources/js/ssr.tsx",   "isEntry":true}
          }
          EOF

      - name: TypeScript type check
        run: npm run types
        continue-on-error: true

      - name: Run PHPUnit tests
        run: php artisan test --parallel
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint . --max-warnings 0 || true

      - name: Prettier format check
        run: npm run format:check || true
